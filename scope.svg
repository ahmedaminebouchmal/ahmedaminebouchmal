<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f14"/><stop offset="100%" stop-color="#070b0f"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04120f"/><stop offset="100%" stop-color="#020a08"/>
    </linearGradient>
    <radialGradient id="phos"><stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="scr"><rect x="176" y="66" width="880" height="300"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#sbg)" stroke="#1c2430" stroke-width="1.5"/>

  <!-- instrument chrome -->
  <text x="34" y="40" fill="#5eead4" font-size="12.5" font-weight="700" letter-spacing="2.5">MULTI-DOMAIN CAPTURE</text>
  <text x="34" y="58" fill="#3d4d5c" font-size="8.5" letter-spacing="1.6">SYNCHRONISED &#183; HASH-TRACKED</text>
  <g>
    <circle cx="1150" cy="34" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <text x="1164" y="38" fill="#5eead4" font-size="9.5">ARMED</text>
    <text x="1206" y="38" fill="#3d4d5c" font-size="9.5" text-anchor="end">REC</text>
  </g>

  <!-- left control rail -->
  <g>
    <rect x="34" y="76" width="118" height="280" rx="6" fill="#0c1218" stroke="#1c2430"/>
    <text x="48" y="98" fill="#3d4d5c" font-size="8" letter-spacing="1.4">TIMEBASE</text>
    <text x="48" y="116" fill="#c9d1d9" font-size="12">2 &#181;s/div</text>
    <line x1="48" y1="128" x2="138" y2="128" stroke="#1c2430"/>
    <text x="48" y="148" fill="#3d4d5c" font-size="8" letter-spacing="1.4">BIT RATE</text>
    <text x="48" y="166" fill="#5eead4" font-size="12">500 kbit/s</text>
    <text x="48" y="180" fill="#3d4d5c" font-size="8">CAN-FD 2 Mbit data</text>
    <line x1="48" y1="192" x2="138" y2="192" stroke="#1c2430"/>
    <text x="48" y="212" fill="#3d4d5c" font-size="8" letter-spacing="1.4">SAMPLE PT</text>
    <text x="48" y="230" fill="#c9d1d9" font-size="12">87.5 %</text>
    <line x1="48" y1="242" x2="138" y2="242" stroke="#1c2430"/>
    <text x="48" y="262" fill="#3d4d5c" font-size="8" letter-spacing="1.4">TIME SOURCE</text>
    <text x="48" y="280" fill="#79c0ff" font-size="11">PPS &#183; PTP</text>
    <text x="48" y="294" fill="#3d4d5c" font-size="8">disciplined</text>
    <line x1="48" y1="306" x2="138" y2="306" stroke="#1c2430"/>
    <text x="48" y="326" fill="#3d4d5c" font-size="8" letter-spacing="1.4">TX STATE</text>
    <text x="48" y="344" fill="#fb923c" font-size="11">RECEIVE-ONLY</text>
  </g>

  <!-- screen -->
  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#screenGrad)" stroke="#1a3d36" stroke-width="1.2"/>
  <ellipse cx="616" cy="216" rx="420" ry="150" fill="url(#phos)" opacity="0.4"/>
  <g clip-path="url(#scr)">
    <!-- graticule -->
    <g stroke="#123028" stroke-width="0.6">
      <path d="M264 66v300M352 66v300M440 66v300M528 66v300M616 66v300M704 66v300M792 66v300M880 66v300M968 66v300"/>
      <path d="M176 116h880M176 166h880M176 216h880M176 266h880M176 316h880"/>
    </g>
    <g stroke="#1a4d42" stroke-width="0.9"><path d="M616 66v300M176 216h880"/></g>

    <!-- CH1 : CAN_H -->
    <g filter="url(#gl)">
      <path d="M176 118 h22 v-16 h14 v16 h30 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h30 v-16 h14 v16 h60"
            fill="none" stroke="#5eead4" stroke-width="1.7">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M352 118 h22 v-16 h14 v16 h30 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h22 v-16 h30 v16 h14 v-16 h22 v16 h38 v-16 h14 v16 h30 v-16 h14 v16 h60"
            fill="none" stroke="#5eead4" stroke-width="1.7">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- CH2 : CAN_L (mirror) -->
    <g filter="url(#gl)">
      <path d="M176 186 h22 v16 h14 v-16 h30 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h30 v16 h14 v-16 h60"
            fill="none" stroke="#f59e0b" stroke-width="1.7">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M352 186 h22 v16 h14 v-16 h30 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h22 v16 h30 v-16 h14 v16 h22 v-16 h38 v16 h14 v-16 h30 v16 h14 v-16 h60"
            fill="none" stroke="#f59e0b" stroke-width="1.7">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- CH3 : differential w/ ringing -->
    <g filter="url(#gl)">
      <path d="M176 262 h22 q3 -26 8 -20 q3 4 6 -2 v22 h30 q3 -26 8 -20 q3 4 6 -2 v22 h22 q3 -26 8 -20 q3 4 6 -2 v22 h30 q3 26 8 20 q3 -4 6 2 v-22 h22 q3 -26 8 -20 q3 4 6 -2 v22 h38 q3 -26 8 -20 q3 4 6 -2 v22 h22 q3 26 8 20 q3 -4 6 2 v-22 h30 q3 -26 8 -20 q3 4 6 -2 v22 h60"
            fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.95">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M352 262 h22 q3 -26 8 -20 q3 4 6 -2 v22 h30 q3 -26 8 -20 q3 4 6 -2 v22 h22 q3 -26 8 -20 q3 4 6 -2 v22 h30 q3 26 8 20 q3 -4 6 2 v-22 h22 q3 -26 8 -20 q3 4 6 -2 v22 h38 q3 -26 8 -20 q3 4 6 -2 v22 h22 q3 26 8 20 q3 -4 6 2 v-22 h30 q3 -26 8 -20 q3 4 6 -2 v22 h60"
            fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.95">
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- decoded frame bar -->
    <g>
      <g>
        <rect x="200" y="316" width="120" height="26" rx="3" fill="#0d2b25" stroke="#5eead4" stroke-width="1"/>
        <text x="260" y="333" fill="#5eead4" font-size="9" text-anchor="middle">ID 0x18F 8B</text>
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="356" y="316" width="104" height="26" rx="3" fill="#0d2b25" stroke="#5eead4" stroke-width="1"/>
        <text x="408" y="333" fill="#5eead4" font-size="9" text-anchor="middle">ID 0x2A1 4B</text>
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="496" y="316" width="132" height="26" rx="3" fill="#2b1010" stroke="#f87171" stroke-width="1"/>
        <text x="562" y="333" fill="#f87171" font-size="9" text-anchor="middle">FORM ERROR</text>
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="664" y="316" width="120" height="26" rx="3" fill="#0d2b25" stroke="#5eead4" stroke-width="1"/>
        <text x="724" y="333" fill="#5eead4" font-size="9" text-anchor="middle">ID 0x0C3 8B</text>
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="820" y="316" width="128" height="26" rx="3" fill="#0d2b25" stroke="#5eead4" stroke-width="1"/>
        <text x="884" y="333" fill="#5eead4" font-size="9" text-anchor="middle">ID 0x711 FD</text>
        <animateTransform attributeName="transform" type="translate" values="0,0;-176,0" dur="4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- trigger marker + sweep -->
    <path d="M616 66 v300" stroke="#f87171" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>
    <rect x="176" y="66" width="3" height="300" fill="#5eead4" opacity="0.35">
      <animate attributeName="x" values="176;1053;176" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- channel labels -->
  <g font-size="9">
    <text x="186" y="106" fill="#5eead4">CH1 CAN_H</text>
    <text x="186" y="174" fill="#f59e0b">CH2 CAN_L</text>
    <text x="186" y="250" fill="#a78bfa">CH3 DIFF</text>
    <text x="186" y="308" fill="#3d4d5c">DECODE</text>
    <text x="626" y="80" fill="#f87171" font-size="8">TRIG</text>
  </g>

  <!-- right readout rail -->
  <g>
    <rect x="1080" y="76" width="126" height="280" rx="6" fill="#0c1218" stroke="#1c2430"/>
    <text x="1094" y="98" fill="#3d4d5c" font-size="8" letter-spacing="1.4">MEASURED</text>
    <text x="1094" y="118" fill="#c9d1d9" font-size="10.5">t<tspan font-size="7">rise</tspan> 41 ns</text>
    <text x="1094" y="136" fill="#c9d1d9" font-size="10.5">jitter 2.8 ns</text>
    <text x="1094" y="154" fill="#c9d1d9" font-size="10.5">V<tspan font-size="7">diff</tspan> 2.04 V</text>
    <line x1="1094" y1="166" x2="1192" y2="166" stroke="#1c2430"/>
    <text x="1094" y="186" fill="#3d4d5c" font-size="8" letter-spacing="1.4">FRAMES</text>
    <text x="1094" y="206" fill="#5eead4" font-size="13">18 442</text>
    <text x="1094" y="222" fill="#f87171" font-size="10">3 errors</text>
    <line x1="1094" y1="234" x2="1192" y2="234" stroke="#1c2430"/>
    <text x="1094" y="254" fill="#3d4d5c" font-size="8" letter-spacing="1.4">EVIDENCE</text>
    <text x="1094" y="272" fill="#79c0ff" font-size="9">sha256</text>
    <text x="1094" y="286" fill="#4d5b6b" font-size="7.5">9f3c1a&#8230;</text>
    <text x="1094" y="298" fill="#4d5b6b" font-size="7.5">b7e042&#8230;</text>
    <text x="1094" y="310" fill="#4d5b6b" font-size="7.5">2d81ff&#8230;</text>
    <circle cx="1100" cy="330" r="3" fill="#5eead4"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="1110" y="334" fill="#5eead4" font-size="8.5">SEALING</text>
  </g>

  <!-- bottom status -->
  <g font-size="8.5" fill="#3d4d5c">
    <text x="34" y="392">CAN-FD BUS ANALYSER</text>
    <text x="230" y="392">ISOLATED &#183; CH 1-16</text>
    <text x="430" y="392">FPGA TIMESTAMP &#183; PRE-BUFFER</text>
    <text x="700" y="392">CONTINUOUS CAPTURE &#8594; NVMe</text>
    <text x="990" y="392">CORRELATED TIMELINE</text>
  </g>
  <rect x="34" y="404" width="1172" height="2" fill="#0f2620"/>
  <rect x="34" y="404" width="180" height="2" fill="#5eead4">
    <animate attributeName="x" values="34;1026;34" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="432" fill="#2f3b47" font-size="8">receive-only default &#183; transmit requires service permission AND supervisor healthy AND FPGA permission AND MCU request &#183; per channel</text>
  <text x="34" y="448" fill="#2f3b47" font-size="8">every capture carries timestamp, source, node identity, content hash and uncertainty before it reaches the timeline</text>
</svg>
