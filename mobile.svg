<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#080b11"/><stop offset="100%" stop-color="#070a0f"/></linearGradient>
    <linearGradient id="scr1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0e1a2b"/><stop offset="100%" stop-color="#0a1220"/></linearGradient>
    <radialGradient id="ble"><stop offset="0%" stop-color="#42a5f5" stop-opacity="0.55"/><stop offset="100%" stop-color="#42a5f5" stop-opacity="0"/></radialGradient>
    <filter id="mg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1240" height="500" rx="10" fill="url(#mbg)" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="40" fill="#42a5f5" font-size="12.5" font-weight="700" letter-spacing="2.5">CONNECTED PRODUCT &#183; APP SIDE</text>
  <text x="34" y="58" fill="#3d4d5c" font-size="8.5" letter-spacing="1.5">THE HALF THE USER ACTUALLY HOLDS</text>

  <!-- PHONE 1 : provisioning -->
  <g>
    <rect x="70" y="86" width="180" height="340" rx="22" fill="#0c1218" stroke="#2f3b47" stroke-width="2"/>
    <rect x="80" y="110" width="160" height="292" rx="10" fill="url(#scr1)"/>
    <rect x="140" y="94" width="40" height="6" rx="3" fill="#2f3b47"/>
    <text x="160" y="134" fill="#90caf9" font-size="9.5" text-anchor="middle" font-weight="700">PROVISIONING</text>
    <line x1="96" y1="144" x2="224" y2="144" stroke="#1c2a3a"/>
    <!-- scanning list -->
    <g>
      <rect x="96" y="158" width="128" height="26" rx="4" fill="#10233a" stroke="#42a5f5" stroke-width="1"/>
      <circle cx="110" cy="171" r="3.5" fill="#42a5f5"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="122" y="175" fill="#90caf9" font-size="7.5">NODE-C  -42 dBm</text>
      <rect x="96" y="190" width="128" height="26" rx="4" fill="#0d1a2b" stroke="#1c3350" stroke-width="1"/>
      <circle cx="110" cy="203" r="3.5" fill="#3f6b96"/>
      <text x="122" y="207" fill="#5b7fa6" font-size="7.5">NODE-A  -67 dBm</text>
      <rect x="96" y="222" width="128" height="26" rx="4" fill="#0d1a2b" stroke="#1c3350" stroke-width="1"/>
      <circle cx="110" cy="235" r="3.5" fill="#3f6b96"/>
      <text x="122" y="239" fill="#5b7fa6" font-size="7.5">NODE-F  -71 dBm</text>
    </g>
    <!-- pairing progress -->
    <text x="96" y="278" fill="#4d6b8a" font-size="7.5">GATT handshake</text>
    <rect x="96" y="286" width="128" height="6" rx="3" fill="#10233a"/>
    <rect x="96" y="286" width="0" height="6" rx="3" fill="#42a5f5">
      <animate attributeName="width" values="0;128;128;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="96" y="312" fill="#4d6b8a" font-size="7.5">credential exchange</text>
    <rect x="96" y="320" width="128" height="6" rx="3" fill="#10233a"/>
    <rect x="96" y="320" width="0" height="6" rx="3" fill="#5eead4">
      <animate attributeName="width" values="0;0;128;128" dur="4s" repeatCount="indefinite"/>
    </rect>
    <g>
      <circle cx="106" cy="352" r="4" fill="#5eead4"><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></circle>
      <text x="118" y="356" fill="#5eead4" font-size="8"><tspan>paired &#183; sealed</tspan><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></text>
    </g>
    <text x="160" y="384" fill="#2f4a63" font-size="7" text-anchor="middle">recovers from interruption</text>
    <text x="160" y="446" fill="#42a5f5" font-size="8.5" text-anchor="middle">Flutter</text>
  </g>

  <!-- BLE field between phone and device -->
  <ellipse cx="300" cy="240" rx="60" ry="80" fill="url(#ble)" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/></ellipse>
  <g stroke="#42a5f5" fill="none" stroke-width="1.4">
    <path d="M266 220 a26 26 0 0 1 0 40"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M278 208 a40 40 0 0 1 0 64"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></path>
    <path d="M290 196 a54 54 0 0 1 0 88"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></path>
  </g>
  <text x="300" y="330" fill="#2f4a63" font-size="7.5" text-anchor="middle">BLE / GATT</text>

  <!-- PHONE 2 : OTA -->
  <g>
    <rect x="352" y="86" width="180" height="340" rx="22" fill="#0c1218" stroke="#2f3b47" stroke-width="2"/>
    <rect x="362" y="110" width="160" height="292" rx="10" fill="url(#scr1)"/>
    <rect x="422" y="94" width="40" height="6" rx="3" fill="#2f3b47"/>
    <text x="442" y="134" fill="#8fe3fb" font-size="9.5" text-anchor="middle" font-weight="700">OTA UPDATE</text>
    <line x1="378" y1="144" x2="506" y2="144" stroke="#1c2a3a"/>
    <text x="378" y="166" fill="#4d6b8a" font-size="7.5">fw 2.4.1 &#8594; 2.5.0</text>
    <!-- staged bars -->
    <g>
      <text x="378" y="188" fill="#4d6b8a" font-size="7">download</text>
      <rect x="378" y="194" width="128" height="7" rx="3.5" fill="#10233a"/>
      <rect x="378" y="194" width="128" height="7" rx="3.5" fill="#61dafb"/>
      <text x="378" y="218" fill="#4d6b8a" font-size="7">verify signature</text>
      <rect x="378" y="224" width="128" height="7" rx="3.5" fill="#10233a"/>
      <rect x="378" y="224" width="128" height="7" rx="3.5" fill="#61dafb"/>
      <text x="378" y="248" fill="#4d6b8a" font-size="7">write slot B</text>
      <rect x="378" y="254" width="128" height="7" rx="3.5" fill="#10233a"/>
      <rect x="378" y="254" width="40" height="7" rx="3.5" fill="#61dafb">
        <animate attributeName="width" values="10;128;10" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <text x="378" y="278" fill="#3d5b7a" font-size="7">swap &amp; boot</text>
      <rect x="378" y="284" width="128" height="7" rx="3.5" fill="#10233a"/>
      <text x="378" y="308" fill="#3d5b7a" font-size="7">confirm health</text>
      <rect x="378" y="314" width="128" height="7" rx="3.5" fill="#10233a"/>
    </g>
    <!-- rollback -->
    <rect x="378" y="336" width="128" height="30" rx="5" fill="#1a1206" stroke="#f59e0b" stroke-width="1"/>
    <text x="442" y="349" fill="#fbbf24" font-size="7.5" text-anchor="middle">A/B SLOTS &#183; ROLLBACK</text>
    <text x="442" y="360" fill="#7a5a1f" font-size="6.5" text-anchor="middle">tested, not assumed</text>
    <text x="442" y="390" fill="#2f4a63" font-size="7" text-anchor="middle">no brick on power loss</text>
    <text x="442" y="446" fill="#61dafb" font-size="8.5" text-anchor="middle">React Native</text>
  </g>

  <!-- FLEET PANEL -->
  <g>
    <rect x="596" y="86" width="280" height="340" rx="10" fill="#0c1218" stroke="#1c2430" stroke-width="1.4"/>
    <text x="616" y="112" fill="#5eead4" font-size="9.5" font-weight="700" letter-spacing="1.4">FLEET STATE</text>
    <text x="616" y="128" fill="#2f4f47" font-size="7">truthful when devices go dark</text>
    <line x1="616" y1="140" x2="856" y2="140" stroke="#1c2430"/>
    <g font-size="7.5">
      <!-- rows -->
      <g>
        <rect x="616" y="152" width="240" height="26" rx="4" fill="#0d1f1c" stroke="#1a3d36"/>
        <circle cx="630" cy="165" r="4" fill="#5eead4"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="644" y="169" fill="#7fdbca">node-c-01   2.5.0   online</text>
      </g>
      <g>
        <rect x="616" y="184" width="240" height="26" rx="4" fill="#0d1f1c" stroke="#1a3d36"/>
        <circle cx="630" cy="197" r="4" fill="#5eead4"/>
        <text x="644" y="201" fill="#7fdbca">node-a-04   2.5.0   online</text>
      </g>
      <g>
        <rect x="616" y="216" width="240" height="26" rx="4" fill="#1a1206" stroke="#7a5a1f"/>
        <circle cx="630" cy="229" r="4" fill="#f59e0b"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
        <text x="644" y="233" fill="#fbbf24">node-f-02   2.4.1   updating</text>
      </g>
      <g>
        <rect x="616" y="248" width="240" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
        <circle cx="630" cy="261" r="4" fill="#6e7681"/>
        <text x="644" y="265" fill="#8b949e">node-g-01   2.4.1   offline 6d</text>
      </g>
      <g>
        <rect x="616" y="280" width="240" height="26" rx="4" fill="#2b1010" stroke="#7f1d1d"/>
        <circle cx="630" cy="293" r="4" fill="#f87171"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
        <text x="644" y="297" fill="#fca5a5">node-e-03   2.5.0   rolled back</text>
      </g>
    </g>
    <line x1="616" y1="322" x2="856" y2="322" stroke="#1c2430"/>
    <text x="616" y="344" fill="#3d4d5c" font-size="7.5">staged rollout</text>
    <rect x="616" y="352" width="240" height="8" rx="4" fill="#10233a"/>
    <rect x="616" y="352" width="96" height="8" rx="4" fill="#5eead4">
      <animate attributeName="width" values="48;168;48" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="616" y="378" fill="#4b5563" font-size="7">canary &#8594; 10% &#8594; 50% &#8594; all &#183; halt on health regression</text>
    <text x="616" y="400" fill="#3d444d" font-size="7">offline devices report on reconnect &#183; state is never assumed</text>
  </g>

  <!-- NATIVE COLUMN -->
  <g>
    <rect x="908" y="86" width="272" height="340" rx="10" fill="#0c1218" stroke="#1c2430" stroke-width="1.4"/>
    <text x="928" y="112" fill="#c9d1d9" font-size="9.5" font-weight="700" letter-spacing="1.4">WHEN NATIVE WINS</text>
    <line x1="928" y1="124" x2="1160" y2="124" stroke="#1c2430"/>
    <g>
      <rect x="928" y="140" width="110" height="72" rx="7" fill="#0d1a12" stroke="#3DDC84" stroke-width="1.2"/>
      <text x="983" y="166" fill="#3DDC84" font-size="9" text-anchor="middle" font-weight="700">Android</text>
      <text x="983" y="182" fill="#5c8a6a" font-size="7" text-anchor="middle">Kotlin</text>
      <text x="983" y="196" fill="#4a6b55" font-size="6.5" text-anchor="middle">BLE stack control</text>
      <rect x="1050" y="140" width="110" height="72" rx="7" fill="#14161a" stroke="#c9d1d9" stroke-width="1.2"/>
      <text x="1105" y="166" fill="#e6edf3" font-size="9" text-anchor="middle" font-weight="700">iOS</text>
      <text x="1105" y="182" fill="#8b949e" font-size="7" text-anchor="middle">Swift</text>
      <text x="1105" y="196" fill="#6e7681" font-size="6.5" text-anchor="middle">CoreBluetooth</text>
    </g>
    <text x="928" y="238" fill="#3d4d5c" font-size="7.5">native is the right call when&#8230;</text>
    <g font-size="7.5" fill="#7d8590">
      <text x="940" y="258">&#183; background BLE must survive the OS</text>
      <text x="940" y="276">&#183; pairing needs platform-specific keychain</text>
      <text x="940" y="294">&#183; throughput or MTU tuning matters</text>
      <text x="940" y="312">&#183; the app must run for hours on a bench</text>
    </g>
    <line x1="928" y1="330" x2="1160" y2="330" stroke="#1c2430"/>
    <text x="928" y="352" fill="#3d4d5c" font-size="7.5">cross-platform is the right call when&#8230;</text>
    <g font-size="7.5" fill="#7d8590">
      <text x="940" y="372">&#183; the UI is the product, not the radio</text>
      <text x="940" y="390">&#183; two platforms, one small team</text>
      <text x="940" y="408">&#183; iteration speed beats last-10% control</text>
    </g>
  </g>

  <!-- footer -->
  <text x="34" y="466" fill="#3d444d" font-size="8">provisioning that works on a bad day &#183; OTA with a rollback path that has actually been exercised &#183; pairing that recovers from interruption</text>
  <text x="34" y="482" fill="#2f3b47" font-size="8">the firmware and the app are one product &#8212; shipping them out of step is how connected hardware fails in the field</text>
</svg>
