<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="ebg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#15060f"/><stop offset="100%" stop-color="#0b0409"/></linearGradient>
    <linearGradient id="escr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#180712"/><stop offset="100%" stop-color="#0a040a"/></linearGradient>
    <filter id="egl2"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="eclip"><rect x="176" y="66" width="880" height="300"/></clipPath>
    <clipPath id="epreview"><rect x="192" y="100" width="240" height="150"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#ebg2)" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="40" fill="#f472b6" font-size="12.5" font-weight="700" letter-spacing="2.5">FRAME TIMELINE &amp; SYNC</text>
  <text x="34" y="58" fill="#6b2447" font-size="8.5" letter-spacing="1.6">NODE E &#183; VISION &amp; PHYSICAL &#183; EVIDENCE, NOT FOOTAGE</text>
  <circle cx="1150" cy="34" r="5" fill="#f472b6"><animate attributeName="opacity" values="1;0.2;1" dur="1.25s" repeatCount="indefinite"/></circle>
  <text x="1163" y="38" fill="#f472b6" font-size="9" letter-spacing="1.2">TRIG</text>

  <rect x="34" y="66" width="128" height="300" rx="5" fill="#130610" stroke="#4a1533"/>
  <g font-size="7.5" fill="#6b2447">
    <text x="46" y="86">SENSOR LINK</text><text x="46" y="128">RESOLUTION</text><text x="46" y="170">FRAME RATE</text>
    <text x="46" y="212">EXPOSURE</text><text x="46" y="254">TRANSPORT</text><text x="46" y="296">TRIGGER</text><text x="46" y="338">DROP POLICY</text>
  </g>
  <g font-size="10.5" fill="#f9a8d4">
    <text x="46" y="102">MIPI CSI-2</text><text x="46" y="144">1920&#215;1080</text><text x="46" y="186">60 fps</text>
    <text x="46" y="228">4.1 ms</text><text x="46" y="270">RTSP / ONVIF</text><text x="46" y="312">hardware</text>
  </g>
  <text x="46" y="354" font-size="10.5" fill="#f472b6" font-weight="700">RECORDED</text>

  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#escr)" stroke="#4a1533"/>
  <g clip-path="url(#eclip)">
    <!-- preview -->
    <rect x="192" y="100" width="240" height="150" rx="3" fill="#0d0309" stroke="#4a1533"/>
    <g clip-path="url(#epreview)">
      <g fill="none" stroke="#6b2447" stroke-width="1">
        <rect x="228" y="140" width="60" height="72"/><rect x="312" y="164" width="46" height="48"/>
        <path d="M192 212 H432"/>
      </g>
      <rect x="222" y="134" width="72" height="84" fill="none" stroke="#f472b6" stroke-width="1.2"/>
      <text x="222" y="130" fill="#f472b6" font-size="7">obj 0.94</text>
      <rect x="192" y="100" width="240" height="2" fill="#f472b6" opacity="0.55">
        <animate attributeName="y" values="100;248;100" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="192" y="266" fill="#6b2447" font-size="7.5">LIVE &#183; ISP TUNED, NOT AUTO</text>

    <!-- frame timeline -->
    <line x1="456" y1="76" x2="456" y2="356" stroke="#4a1533"/>
    <text x="472" y="90" fill="#6b2447" font-size="7.5">FRAME TIMELINE &#183; EVERY GAP IS RECORDED AS A GAP</text>
    <g>
      <rect x="472" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="486" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="500" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="514" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="528" y="104" width="10" height="26" rx="1" fill="#f87171" opacity="0.9"/>
      <rect x="542" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="556" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="570" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="584" y="104" width="10" height="26" rx="1" fill="#fbbf24" opacity="0.9"/>
      <rect x="598" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="612" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="626" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="640" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="654" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="668" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="682" y="104" width="10" height="26" rx="1" fill="#f472b6" opacity="0.8"/>
      <rect x="472" y="100" width="10" height="34" fill="none" stroke="#5eead4" stroke-width="1.2">
        <animate attributeName="x" values="472;682;472" dur="5.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="528" y="150" fill="#f87171" font-size="7.5">frame 4471 dropped &#183; logged, not silently skipped</text>
    <text x="528" y="164" fill="#fbbf24" font-size="7.5">frame 4475 late 3.1 ms &#183; flagged</text>

    <!-- cross-domain sync -->
    <line x1="472" y1="188" x2="1040" y2="188" stroke="#4a1533"/>
    <text x="472" y="208" fill="#6b2447" font-size="7.5">CROSS-DOMAIN CORRELATION &#183; ONE TIMEBASE</text>
    <g font-size="8.5">
      <text x="472" y="232" fill="#f9a8d4">camera</text><rect x="560" y="224" width="480" height="9" rx="2" fill="#150410" stroke="#4a1533"/>
      <rect x="700" y="225" width="6" height="7" fill="#f472b6"/><text x="712" y="232" fill="#f9a8d4">event t=12.4187 s</text>
      <text x="472" y="256" fill="#7dd3fc">bus frame</text><rect x="560" y="248" width="480" height="9" rx="2" fill="#150410" stroke="#4a1533"/>
      <rect x="704" y="249" width="6" height="7" fill="#7dd3fc"/><text x="716" y="256" fill="#7dd3fc">ID 0x18F t=12.4189 s</text>
      <text x="472" y="280" fill="#f59e0b">RF</text><rect x="560" y="272" width="480" height="9" rx="2" fill="#150410" stroke="#4a1533"/>
      <rect x="696" y="273" width="6" height="7" fill="#f59e0b"/><text x="708" y="280" fill="#f59e0b">burst t=12.4185 s</text>
      <line x1="702" y1="218" x2="702" y2="288" stroke="#5eead4" stroke-dasharray="3 3" stroke-width="1"/>
    </g>
    <text x="472" y="308" fill="#5eead4" font-size="8.5">three domains, 0.4 ms apart, on one clock &#8212; that is a correlated observation</text>
    <text x="472" y="326" fill="#6b2447" font-size="7.5">on three separate host clocks it would be three unrelated recordings that happened the same afternoon</text>
    <text x="472" y="348" fill="#6b2447" font-size="7.5">hardware-synced trigger is what makes the claim defensible rather than suggestive</text>
  </g>

  <rect x="1072" y="66" width="134" height="300" rx="5" fill="#130610" stroke="#4a1533"/>
  <g font-size="7.5" fill="#6b2447"><text x="1084" y="86">PIPELINE</text><text x="1084" y="176">INTEGRITY</text><text x="1084" y="272">EVIDENCE</text></g>
  <g font-size="9" fill="#f9a8d4">
    <text x="1084" y="104">GStreamer</text><text x="1084" y="118">H.265 main</text><text x="1084" y="132">latency 38 ms</text>
    <text x="1084" y="146">edge infer 12 ms</text><text x="1084" y="160">PoE 21.4 W</text>
    <text x="1084" y="194">frames 268 440</text><text x="1084" y="208">dropped 1</text><text x="1084" y="222">late 3</text><text x="1084" y="236">gaps logged 4</text>
    <text x="1084" y="290">sha256 7c92&#8230;</text><text x="1084" y="304">frame index</text><text x="1084" y="318">+ detection meta</text>
  </g>
  <text x="1084" y="250" font-size="9" fill="#34d399">no silent loss</text>
  <text x="1084" y="340" font-size="9" fill="#34d399">export carries</text>
  <text x="1084" y="354" font-size="9" fill="#34d399">provenance</text>

  <g font-size="8.5" fill="#6b2447">
    <text x="34" y="392">MIPI CSI-2 &#183; GMSL</text><text x="220" y="392">IP &#183; PoE &#183; ONVIF &#183; RTSP</text><text x="450" y="392">EDGE INFERENCE</text>
    <text x="640" y="392">HARDWARE-SYNCED TRIGGER</text><text x="900" y="392">SAME TIMESTAMP DOMAIN</text>
  </g>
  <rect x="34" y="404" width="1172" height="2" fill="#4a1533"/>
  <rect x="34" y="404" width="180" height="2" fill="#f472b6"><animate attributeName="x" values="34;1026;34" dur="9s" repeatCount="indefinite"/></rect>
  <text x="34" y="432" fill="#3f1329" font-size="8">frame pacing and drop policy are specified, not inherited from whatever the pipeline happens to do under load</text>
  <text x="34" y="448" fill="#3f1329" font-size="8">a dropped frame nobody recorded as dropped is worse than a gap &#8212; it makes the timeline look complete when it is not</text>
</svg>
