<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 430" width="1240" height="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07231c"/><stop offset="50%" stop-color="#0a2e24"/><stop offset="100%" stop-color="#06201a"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.35"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="pwr"><stop offset="0%" stop-color="#5eead4" stop-opacity="0.7"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <filter id="bglow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1240" height="430" rx="10" fill="#060a0e" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="38" fill="#5eead4" font-size="12.5" font-weight="700" letter-spacing="2.5">BOARD BRING-UP</text>
  <text x="34" y="56" fill="#3d4d5c" font-size="8.5" letter-spacing="1.6">SCHEMATIC &#8594; LAYOUT &#8594; FAB &#8594; POWER &#8594; ENUMERATE</text>

  <!-- board -->
  <rect x="150" y="76" width="800" height="290" rx="8" fill="url(#pcb)" stroke="#34d399" stroke-width="1.4" opacity="0.95"/>
  <!-- silk border -->
  <rect x="164" y="90" width="772" height="262" rx="5" fill="none" stroke="#0e3a2e" stroke-width="1"/>
  <!-- mounting holes -->
  <g fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.55">
    <circle cx="176" cy="102" r="6"/><circle cx="924" cy="102" r="6"/><circle cx="176" cy="340" r="6"/><circle cx="924" cy="340" r="6"/>
  </g>

  <!-- copper pour hatch -->
  <g stroke="#0d4034" stroke-width="0.5" opacity="0.55">
    <path d="M170 96 L940 96 M170 116 L940 116 M170 136 L940 136 M170 156 L940 156 M170 176 L940 176 M170 196 L940 196 M170 216 L940 216 M170 236 L940 236 M170 256 L940 256 M170 276 L940 276 M170 296 L940 296 M170 316 L940 316 M170 336 L940 336"/>
  </g>

  <!-- traces (drawn progressively) -->
  <g fill="none" stroke="url(#cu)" stroke-width="2" stroke-linecap="round">
    <path d="M240 210 H330 V150 H420" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0" dur="2.2s" fill="freeze"/></path>
    <path d="M240 240 H300 V300 H420" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0" dur="2.2s" begin="0.2s" fill="freeze"/></path>
    <path d="M556 150 H640 V190 H740" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0" dur="2.2s" begin="0.4s" fill="freeze"/></path>
    <path d="M556 300 H660 V250 H740" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;0" dur="2.2s" begin="0.6s" fill="freeze"/></path>
    <path d="M488 196 V260" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" values="120;0" dur="1.4s" begin="0.8s" fill="freeze"/></path>
    <path d="M840 150 V300" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0" dur="1.6s" begin="1s" fill="freeze"/></path>
    <path d="M240 180 H210 V130 H420" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" values="420;0" dur="2.2s" begin="0.3s" fill="freeze"/></path>
  </g>

  <!-- vias -->
  <g fill="#0a2e24" stroke="#f59e0b" stroke-width="1.2">
    <circle cx="330" cy="150" r="3.5"/><circle cx="300" cy="300" r="3.5"/><circle cx="640" cy="190" r="3.5"/>
    <circle cx="660" cy="250" r="3.5"/><circle cx="488" cy="260" r="3.5"/><circle cx="840" cy="220" r="3.5"/>
  </g>

  <!-- power plane energising -->
  <circle cx="200" cy="210" r="70" fill="url(#pwr)" opacity="0">
    <animate attributeName="opacity" values="0;0.55;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="20;150;20" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- components -->
  <!-- PMIC -->
  <g>
    <rect x="186" y="176" width="56" height="76" rx="3" fill="#0b1a16" stroke="#5eead4" stroke-width="1.3"/>
    <text x="214" y="210" fill="#5eead4" font-size="8.5" text-anchor="middle">PMIC</text>
    <text x="214" y="224" fill="#2f6b5c" font-size="7" text-anchor="middle">3V3/1V8</text>
    <circle cx="214" cy="240" r="3" fill="#5eead4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- MCU -->
  <g>
    <rect x="420" y="112" width="136" height="84" rx="3" fill="#0b1a16" stroke="#79c0ff" stroke-width="1.4"/>
    <text x="488" y="148" fill="#79c0ff" font-size="10" text-anchor="middle">STM32H5</text>
    <text x="488" y="164" fill="#2f5b7b" font-size="7.5" text-anchor="middle">safety supervisor MCU</text>
    <g fill="#79c0ff" opacity="0.75">
      <rect x="428" y="106" width="4" height="6"/><rect x="444" y="106" width="4" height="6"/><rect x="460" y="106" width="4" height="6"/>
      <rect x="476" y="106" width="4" height="6"/><rect x="492" y="106" width="4" height="6"/><rect x="508" y="106" width="4" height="6"/>
      <rect x="524" y="106" width="4" height="6"/><rect x="540" y="106" width="4" height="6"/>
    </g>
  </g>
  <!-- FPGA -->
  <g>
    <rect x="420" y="260" width="136" height="84" rx="3" fill="#0b1a16" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="488" y="296" fill="#a78bfa" font-size="10" text-anchor="middle">FPGA / SoC</text>
    <text x="488" y="312" fill="#5b4b8a" font-size="7.5" text-anchor="middle">timestamp fabric</text>
    <rect x="428" y="322" width="120" height="4" fill="#a78bfa" opacity="0.25">
      <animate attributeName="width" values="0;120;0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- transceivers -->
  <g>
    <rect x="740" y="130" width="100" height="52" rx="3" fill="#0b1a16" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="790" y="152" fill="#f59e0b" font-size="8.5" text-anchor="middle">CAN-FD &#215;8</text>
    <text x="790" y="166" fill="#7a5a1f" font-size="7" text-anchor="middle">isolated</text>
    <rect x="740" y="228" width="100" height="52" rx="3" fill="#0b1a16" stroke="#fb923c" stroke-width="1.2"/>
    <text x="790" y="250" fill="#fb923c" font-size="8.5" text-anchor="middle">LIN / K-Line</text>
    <text x="790" y="264" fill="#7a4a1f" font-size="7" text-anchor="middle">protected</text>
  </g>
  <!-- DDR + NVMe -->
  <g>
    <rect x="600" y="212" width="72" height="30" rx="2" fill="#0b1a16" stroke="#34d399" stroke-width="1"/>
    <text x="636" y="231" fill="#34d399" font-size="8" text-anchor="middle">DDR</text>
    <rect x="600" y="252" width="72" height="30" rx="2" fill="#0b1a16" stroke="#34d399" stroke-width="1"/>
    <text x="636" y="271" fill="#34d399" font-size="8" text-anchor="middle">NVMe</text>
  </g>
  <!-- connector -->
  <g>
    <rect x="880" y="140" width="46" height="160" rx="3" fill="#0b1a16" stroke="#94a3b8" stroke-width="1.2"/>
    <g fill="#94a3b8" opacity="0.7">
      <rect x="888" y="152" width="30" height="4"/><rect x="888" y="166" width="30" height="4"/><rect x="888" y="180" width="30" height="4"/>
      <rect x="888" y="194" width="30" height="4"/><rect x="888" y="208" width="30" height="4"/><rect x="888" y="222" width="30" height="4"/>
      <rect x="888" y="236" width="30" height="4"/><rect x="888" y="250" width="30" height="4"/><rect x="888" y="264" width="30" height="4"/>
      <rect x="888" y="278" width="30" height="4"/>
    </g>
    <text x="903" y="318" fill="#64748b" font-size="7.5" text-anchor="middle">DSUB</text>
  </g>
  <!-- passives -->
  <g fill="#0b1a16" stroke="#2f6b5c" stroke-width="0.9">
    <rect x="270" y="130" width="12" height="6"/><rect x="292" y="130" width="12" height="6"/>
    <rect x="270" y="330" width="12" height="6"/><rect x="700" y="112" width="12" height="6"/>
    <rect x="700" y="322" width="12" height="6"/><rect x="360" y="230" width="12" height="6"/>
  </g>

  <!-- signal running the routed path -->
  <circle r="3.2" fill="#5eead4" filter="url(#bglow)">
    <animateMotion path="M240 210 H330 V150 H420" dur="1.6s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#f59e0b" filter="url(#bglow)">
    <animateMotion path="M556 150 H640 V190 H740" dur="1.6s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#a78bfa" filter="url(#bglow)">
    <animateMotion path="M556 300 H660 V250 H740" dur="1.6s" begin="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- bring-up checklist -->
  <g>
    <rect x="978" y="76" width="228" height="290" rx="6" fill="#0c1218" stroke="#1c2430"/>
    <text x="994" y="98" fill="#3d4d5c" font-size="8" letter-spacing="1.4">BRING-UP SEQUENCE</text>
    <g font-size="9">
      <text x="1010" y="124" fill="#5eead4">rails within tolerance</text>
      <text x="1010" y="150" fill="#5eead4">clock present &#183; locked</text>
      <text x="1010" y="176" fill="#5eead4">JTAG / SWD enumerates</text>
      <text x="1010" y="202" fill="#5eead4">isolation verified</text>
      <text x="1010" y="228" fill="#5eead4">transceiver loopback</text>
      <text x="1010" y="254" fill="#f59e0b">bus termination check</text>
      <text x="1010" y="280" fill="#3d4d5c">thermal soak</text>
      <text x="1010" y="306" fill="#3d4d5c">timestamp characterisation</text>
      <text x="1010" y="332" fill="#3d4d5c">signal integrity sweep</text>
    </g>
    <g>
      <circle cx="996" cy="120" r="3.4" fill="#5eead4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/></circle>
      <circle cx="996" cy="146" r="3.4" fill="#5eead4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/></circle>
      <circle cx="996" cy="172" r="3.4" fill="#5eead4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/></circle>
      <circle cx="996" cy="198" r="3.4" fill="#5eead4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/></circle>
      <circle cx="996" cy="224" r="3.4" fill="#5eead4"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/></circle>
      <circle cx="996" cy="250" r="3.4" fill="#f59e0b"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="996" cy="276" r="3.4" fill="none" stroke="#2f3b47" stroke-width="1"/>
      <circle cx="996" cy="302" r="3.4" fill="none" stroke="#2f3b47" stroke-width="1"/>
      <circle cx="996" cy="328" r="3.4" fill="none" stroke="#2f3b47" stroke-width="1"/>
    </g>
  </g>

  <!-- footer -->
  <g font-size="8" fill="#2f3b47">
    <text x="34" y="392">KiCad &#183; ERC / DRC enforced &#183; deterministic diffs &#183; manufacturing output requires human approval</text>
    <text x="34" y="408">isolation and power-tree reviewed before first power-on &#183; no live-vehicle procedures on a bench instrument</text>
  </g>
</svg>
