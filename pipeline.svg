<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b11"/><stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="pg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1240" height="500" rx="10" fill="url(#pbg)" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="40" fill="#5eead4" font-size="12.5" font-weight="700" letter-spacing="2.5">PROTOTYPE &#8594; MANUFACTURE</text>
  <text x="34" y="58" fill="#3d4d5c" font-size="8.5" letter-spacing="1.5">EACH GATE HAS AN EXIT CRITERION &#183; NOTHING ADVANCES ON OPTIMISM</text>

  <!-- main track -->
  <rect x="60" y="196" width="1120" height="3" rx="1.5" fill="#1c2430"/>
  <rect x="60" y="196" width="1120" height="3" rx="1.5" fill="url(#track)"/>
  <circle r="6" fill="#5eead4" filter="url(#pg)">
    <animateMotion path="M60 197 H1180" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- STAGE TEMPLATE -->
  <!-- 1 concept -->
  <g>
    <circle cx="112" cy="197" r="9" fill="#0a0f16" stroke="#5eead4" stroke-width="2"/>
    <circle cx="112" cy="197" r="3.5" fill="#5eead4"/>
    <text x="112" y="150" fill="#5eead4" font-size="9.5" font-weight="700" text-anchor="middle">SCHEMATIC</text>
    <text x="112" y="134" fill="#2f4f47" font-size="7.5" text-anchor="middle">requirements frozen</text>
    <rect x="66" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="112" y="250" fill="#7d8590" font-size="7.5" text-anchor="middle">ERC clean</text>
    <text x="112" y="264" fill="#7d8590" font-size="7.5" text-anchor="middle">power tree</text>
    <text x="112" y="278" fill="#7d8590" font-size="7.5" text-anchor="middle">isolation plan</text>
  </g>
  <!-- 2 layout -->
  <g>
    <circle cx="264" cy="197" r="9" fill="#0a0f16" stroke="#5eead4" stroke-width="2"/>
    <circle cx="264" cy="197" r="3.5" fill="#5eead4"/>
    <text x="264" y="150" fill="#5eead4" font-size="9.5" font-weight="700" text-anchor="middle">LAYOUT</text>
    <text x="264" y="134" fill="#2f4f47" font-size="7.5" text-anchor="middle">stackup &#183; impedance</text>
    <rect x="218" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="264" y="250" fill="#7d8590" font-size="7.5" text-anchor="middle">DRC clean</text>
    <text x="264" y="264" fill="#7d8590" font-size="7.5" text-anchor="middle">DFM review</text>
    <text x="264" y="278" fill="#7d8590" font-size="7.5" text-anchor="middle">panelisation</text>
  </g>
  <!-- 3 rev A -->
  <g>
    <circle cx="416" cy="197" r="9" fill="#0a0f16" stroke="#5eead4" stroke-width="2"/>
    <circle cx="416" cy="197" r="3.5" fill="#5eead4"/>
    <text x="416" y="150" fill="#5eead4" font-size="9.5" font-weight="700" text-anchor="middle">REV A &#183; 5 pcs</text>
    <text x="416" y="134" fill="#2f4f47" font-size="7.5" text-anchor="middle">first article</text>
    <rect x="370" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="416" y="250" fill="#7d8590" font-size="7.5" text-anchor="middle">bring-up</text>
    <text x="416" y="264" fill="#7d8590" font-size="7.5" text-anchor="middle">rails &#183; clocks</text>
    <text x="416" y="278" fill="#7d8590" font-size="7.5" text-anchor="middle">enumerate</text>
  </g>
  <!-- 4 characterise -->
  <g>
    <circle cx="568" cy="197" r="9" fill="#0a0f16" stroke="#5eead4" stroke-width="2"/>
    <circle cx="568" cy="197" r="3.5" fill="#5eead4"/>
    <text x="568" y="150" fill="#5eead4" font-size="9.5" font-weight="700" text-anchor="middle">CHARACTERISE</text>
    <text x="568" y="134" fill="#2f4f47" font-size="7.5" text-anchor="middle">measured, not claimed</text>
    <rect x="522" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="568" y="250" fill="#7d8590" font-size="7.5" text-anchor="middle">SI / jitter</text>
    <text x="568" y="264" fill="#7d8590" font-size="7.5" text-anchor="middle">thermal soak</text>
    <text x="568" y="278" fill="#7d8590" font-size="7.5" text-anchor="middle">timing budget</text>
  </g>
  <!-- 5 rev B  (current) -->
  <g>
    <circle cx="720" cy="197" r="12" fill="#0a0f16" stroke="#f59e0b" stroke-width="2.4">
      <animate attributeName="r" values="12;15;12" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="197" r="4.5" fill="#f59e0b"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="720" y="150" fill="#f59e0b" font-size="9.5" font-weight="700" text-anchor="middle">REV B &#183; DFM</text>
    <text x="720" y="134" fill="#7a5a1f" font-size="7.5" text-anchor="middle">design for manufacture</text>
    <rect x="674" y="230" width="92" height="62" rx="5" fill="#1a1206" stroke="#f59e0b" stroke-width="1"/>
    <text x="720" y="250" fill="#fbbf24" font-size="7.5" text-anchor="middle">test points</text>
    <text x="720" y="264" fill="#fbbf24" font-size="7.5" text-anchor="middle">ICT fixture</text>
    <text x="720" y="278" fill="#fbbf24" font-size="7.5" text-anchor="middle">yield review</text>
  </g>
  <!-- 6 EMC -->
  <g>
    <circle cx="872" cy="197" r="9" fill="#0a0f16" stroke="#475569" stroke-width="2"/>
    <text x="872" y="150" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">EMC / PRE-COMP</text>
    <text x="872" y="134" fill="#3d4a5c" font-size="7.5" text-anchor="middle">chamber time</text>
    <rect x="826" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="872" y="250" fill="#4b5563" font-size="7.5" text-anchor="middle">radiated</text>
    <text x="872" y="264" fill="#4b5563" font-size="7.5" text-anchor="middle">immunity</text>
    <text x="872" y="278" fill="#4b5563" font-size="7.5" text-anchor="middle">ESD / surge</text>
  </g>
  <!-- 7 pilot -->
  <g>
    <circle cx="1024" cy="197" r="9" fill="#0a0f16" stroke="#475569" stroke-width="2"/>
    <text x="1024" y="150" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">PILOT RUN</text>
    <text x="1024" y="134" fill="#3d4a5c" font-size="7.5" text-anchor="middle">25&#8211;100 units</text>
    <rect x="978" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="1024" y="250" fill="#4b5563" font-size="7.5" text-anchor="middle">EMS partner</text>
    <text x="1024" y="264" fill="#4b5563" font-size="7.5" text-anchor="middle">test coverage</text>
    <text x="1024" y="278" fill="#4b5563" font-size="7.5" text-anchor="middle">first-pass yield</text>
  </g>
  <!-- 8 series -->
  <g>
    <circle cx="1160" cy="197" r="9" fill="#0a0f16" stroke="#475569" stroke-width="2"/>
    <text x="1150" y="150" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">SERIES</text>
    <text x="1150" y="134" fill="#3d4a5c" font-size="7.5" text-anchor="middle">sustaining</text>
    <rect x="1104" y="230" width="92" height="62" rx="5" fill="#0c1218" stroke="#1c2430"/>
    <text x="1150" y="250" fill="#4b5563" font-size="7.5" text-anchor="middle">supply chain</text>
    <text x="1150" y="264" fill="#4b5563" font-size="7.5" text-anchor="middle">EOL watch</text>
    <text x="1150" y="278" fill="#4b5563" font-size="7.5" text-anchor="middle">rev control</text>
  </g>

  <!-- rework loop -->
  <path d="M416 176 C 416 96, 568 96, 568 176" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="5 4"/>
  <polygon points="416,180 412,170 420,170" fill="#f87171"/>
  <text x="492" y="92" fill="#f87171" font-size="8" text-anchor="middle">respin if characterisation fails</text>
  <circle r="2.6" fill="#f87171" opacity="0.9">
    <animateMotion path="M568 176 C 568 96, 416 96, 416 176" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- cost/time band -->
  <g>
    <rect x="60" y="336" width="1120" height="1" fill="#1c2430"/>
    <text x="60" y="358" fill="#3d4d5c" font-size="8" letter-spacing="1.4">COST &amp; LEAD TIME COMPOUND LEFT &#8594; RIGHT</text>
    <rect x="60" y="368" width="1120" height="14" rx="7" fill="#0c1218" stroke="#1c2430"/>
    <rect x="60" y="368" width="150" height="14" rx="7" fill="#134e4a"/>
    <rect x="210" y="368" width="200" height="14" fill="#155e57"/>
    <rect x="410" y="368" width="240" height="14" fill="#1f6f5c"/>
    <rect x="650" y="368" width="240" height="14" fill="#7c5410"/>
    <rect x="890" y="368" width="290" height="14" rx="7" fill="#7f1d1d" opacity="0.75"/>
    <text x="135" y="399" fill="#5eead4" font-size="7.5" text-anchor="middle">days</text>
    <text x="310" y="399" fill="#5eead4" font-size="7.5" text-anchor="middle">1&#8211;2 weeks</text>
    <text x="530" y="399" fill="#5eead4" font-size="7.5" text-anchor="middle">weeks</text>
    <text x="770" y="399" fill="#fbbf24" font-size="7.5" text-anchor="middle">weeks &#183; fixtures</text>
    <text x="1035" y="399" fill="#f87171" font-size="7.5" text-anchor="middle">months &#183; certification &#183; MOQ</text>
  </g>

  <!-- footnotes -->
  <text x="60" y="434" fill="#4b5563" font-size="8">a mistake caught at schematic costs an afternoon &#183; the same mistake caught at pilot costs a tooling run and a lead time</text>
  <text x="60" y="450" fill="#3d444d" font-size="8">dual-use RF / direction-finding hardware adds export-control review (EU 2021/821 &#183; BAFA) before anything crosses a border</text>
  <text x="60" y="466" fill="#3d444d" font-size="8">field deployment adds ruggedisation and environmental qualification &#8212; a bench instrument is not a fielded one</text>
</svg>
