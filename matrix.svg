    <rect x="550" y="106" width="80" height="26" rx="4" class="on"/><circle cx="590" cy="119" r="4" class="dot-on"/>
    <rect x="670" y="106" width="80" height="26" rx="4" class="on"/><circle cx="710" cy="119" r="4" class="dot-on"/>
    <rect x="790" y="106" width="80" height="26" rx="4" class="on"/><circle cx="830" cy="119" r="4" class="dot-on"/>
