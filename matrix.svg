<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 550" width="1240" height="550" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .hdr  { fill:#5eead4; font-size:9px; letter-spacing:1.6px; }
    .row  { fill:#c9d1d9; font-size:9.5px; }
    .sub  { fill:#6e7681; font-size:7.5px; }
    .cell { fill:#0c1218; stroke:#1c2430; stroke-width:1; }
    .on   { fill:#0d1f1c; stroke:#5eead4; stroke-width:1.2; }
    .mid  { fill:#161b22; stroke:#30363d; stroke-width:1; }
    .dot-on  { fill:#5eead4; }
    .dot-mid { fill:#f59e0b; }
    .dot-off { fill:#30363d; }
  </style>
  <defs>
    <linearGradient id="mxbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b11"/><stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="550" rx="10" fill="url(#mxbg)" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="36" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="2.4">CAPABILITY MATRIX</text>
  <text x="34" y="53" class="sub">WHERE EACH DOMAIN TOUCHES THE STACK &#183; FILLED = PRIMARY, AMBER = WORKING, OUTLINE = ADJACENT</text>

  <g class="hdr" text-anchor="middle">
    <text x="470" y="84">SCHEMATIC</text>
    <text x="590" y="84">PCB</text>
    <text x="710" y="84">FIRMWARE</text>
    <text x="830" y="84">PROTOCOL</text>
    <text x="950" y="84">BACKEND</text>
    <text x="1080" y="84">APP</text>
  </g>
  <line x1="34" y1="94" x2="1206" y2="94" stroke="#1c2430"/>

  <!-- RF & wireless -->
  <text x="34" y="122" class="row">RF &amp; wireless</text>
  <text x="34" y="134" class="sub">Wi-Fi, BLE, 802.15.4, LoRaWAN, sub-GHz, SDR</text>
  <g>
