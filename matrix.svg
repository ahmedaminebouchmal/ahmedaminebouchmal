    <rect x="550" y="484" width="80" height="26" rx="4" class="cell"/><circle cx="590" cy="497" r="4" class="dot-off"/>
    <rect x="670" y="484" width="80" height="26" rx="4" class="mid"/><circle cx="710" cy="497" r="4" class="dot-mid"/>
    <rect x="790" y="484" width="80" height="26" rx="4" class="on"/><circle cx="830" cy="497" r="4" class="dot-on"/>
    <rect x="910" y="484" width="80" height="26" rx="4" class="on"/><circle cx="950" cy="497" r="4" class="dot-on"/>
    <rect x="1040" y="484" width="80" height="26" rx="4" class="on"/><circle cx="1080" cy="497" r="4" class="dot-on"/>
