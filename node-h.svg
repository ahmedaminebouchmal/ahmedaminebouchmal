<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#120a16"/><stop offset="100%" stop-color="#09050c"/></linearGradient>
    <linearGradient id="hscr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#150c1a"/><stop offset="100%" stop-color="#09050d"/></linearGradient>
    <linearGradient id="hfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e879f9" stop-opacity="0.3"/><stop offset="100%" stop-color="#e879f9" stop-opacity="0"/></linearGradient>
    <filter id="hgl"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hclip"><rect x="176" y="66" width="880" height="300"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#hbg)" stroke="#1c2430" stroke-width="1.5"/>
  <text x="34" y="40" fill="#e879f9" font-size="12.5" font-weight="700" letter-spacing="2.5">PRECISION ACQUISITION</text>
  <text x="34" y="58" fill="#5c2f66" font-size="8.5" letter-spacing="1.6">NODE H &#183; HARDWARE &amp; MIXED-SIGNAL &#183; TWO SUBSYSTEMS, NOT ONE</text>
  <circle cx="1150" cy="34" r="5" fill="#e879f9"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="1163" y="38" fill="#e879f9" font-size="9" letter-spacing="1.2">SYNC</text>

  <rect x="34" y="66" width="128" height="300" rx="5" fill="#0f0913" stroke="#3d1f45"/>
  <g font-size="7.5" fill="#5c2f66">
    <text x="46" y="86">SLOW PATH</text><text x="46" y="128">RESOLUTION</text><text x="46" y="170">SAMPLE RATE</text>
    <text x="46" y="212">FAST PATH</text><text x="46" y="254">TIMEBASE</text><text x="46" y="296">TRIGGER</text><text x="46" y="338">CHANNELS</text>
  </g>
  <g font-size="10.5" fill="#f0abfc">
    <text x="46" y="102">&#931;-&#916; simultaneous</text><text x="46" y="144">24 bit</text><text x="46" y="186">32 kSa/s</text>
    <text x="46" y="228">high-speed ADC</text><text x="46" y="270">FPGA, shared</text><text x="46" y="312">cross-domain</text>
  </g>
  <text x="46" y="354" font-size="10.5" fill="#e879f9" font-weight="700">8 SIMULTANEOUS</text>

  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#hscr)" stroke="#3d1f45"/>
  <g clip-path="url(#hclip)">
    <!-- rails, slow path -->
    <text x="192" y="88" fill="#5c2f66" font-size="7.5">SLOW PATH &#183; SUPPLY RAILS &#183; 24-BIT, SIMULTANEOUS</text>
    <g stroke="#3d1f45" stroke-width="0.7"><path d="M192 108 H616 M192 140 H616 M192 172 H616"/></g>
    <polyline fill="none" stroke="#e879f9" stroke-width="1.3" points="192,120 232,119 272,121 312,120 352,118 392,121 432,120 472,119 512,122 552,120 592,119 616,120">
      <animate attributeName="points" dur="3.4s" repeatCount="indefinite"
        values="192,120 232,119 272,121 312,120 352,118 392,121 432,120 472,119 512,122 552,120 592,119 616,120;
                192,119 232,121 272,119 312,122 352,120 392,118 432,121 472,120 512,119 552,121 592,120 616,119;
                192,120 232,119 272,121 312,120 352,118 392,121 432,120 472,119 512,122 552,120 592,119 616,120"/>
    </polyline>
    <text x="622" y="123" fill="#f0abfc" font-size="7.5">3V3 &#183; 12 &#181;Vrms</text>
    <polyline fill="none" stroke="#c084fc" stroke-width="1.3" points="192,152 232,153 272,151 312,152 352,154 392,151 432,152 472,153 512,150 552,152 592,153 616,152"/>
    <text x="622" y="155" fill="#f0abfc" font-size="7.5">5V0 &#183; 19 &#181;Vrms</text>
    <polyline fill="none" stroke="#7dd3fc" stroke-width="1.3" points="192,184 232,183 272,185 312,190 352,184 392,183 432,185 472,184 512,183 552,186 592,184 616,184"/>
    <text x="622" y="187" fill="#f0abfc" font-size="7.5">12V &#183; load step</text>
    <text x="192" y="208" fill="#5c2f66" font-size="7.5">right for rails, load steps and power characterisation &#183; useless for edge ringing</text>

    <!-- fast path -->
    <line x1="192" y1="224" x2="1040" y2="224" stroke="#3d1f45"/>
    <text x="192" y="244" fill="#5c2f66" font-size="7.5">FAST PATH &#183; EDGE DETAIL &#183; SAME TRIGGER, DIFFERENT SILICON</text>
    <path fill="url(#hfill)" stroke="none" d="M192 340 L300 340 L316 268 L330 282 L342 272 L356 278 L370 274 L520 274 L536 340 L620 340 Z"/>
    <polyline fill="none" stroke="#e879f9" stroke-width="1.6" filter="url(#hgl)"
      points="192,340 300,340 316,268 330,282 342,272 356,278 370,274 520,274 536,340 620,340"/>
    <g stroke="#5eead4" stroke-width="0.9" stroke-dasharray="3 3">
      <line x1="300" y1="256" x2="300" y2="352"/><line x1="316" y1="256" x2="316" y2="352"/>
    </g>
    <text x="304" y="252" fill="#5eead4" font-size="7">t_rise 41 ns</text>
    <text x="380" y="264" fill="#fbbf24" font-size="7">overshoot 18 %</text>
    <text x="192" y="360" fill="#5c2f66" font-size="7.5">quoting the slow instrument number for this job is how a datasheet stops being true</text>

    <!-- noise floor -->
    <line x1="660" y1="224" x2="660" y2="366" stroke="#3d1f45"/>
    <text x="676" y="244" fill="#5c2f66" font-size="7.5">NOISE FLOOR &#183; MEASURED, NOT QUOTED</text>
    <g>
      <polyline fill="none" stroke="#c084fc" stroke-width="1.1" opacity="0.85"
        points="676,330 706,326 736,332 766,322 796,330 826,318 856,328 886,324 916,331 946,320 976,329 1006,325 1036,330"/>
      <line x1="676" y1="300" x2="1036" y2="300" stroke="#3d1f45" stroke-dasharray="3 3"/>
      <text x="676" y="296" fill="#5c2f66" font-size="7">datasheet claim</text>
      <text x="676" y="346" fill="#f0abfc" font-size="8">achieved -118 dBFS &#183; claim -124 dBFS</text>
      <text x="676" y="360" fill="#fbbf24" font-size="7.5">the 6 dB gap is published, not hidden</text>
    </g>
  </g>

  <rect x="1072" y="66" width="134" height="300" rx="5" fill="#0f0913" stroke="#3d1f45"/>
  <g font-size="7.5" fill="#5c2f66"><text x="1084" y="86">SLOW PATH</text><text x="1084" y="164">FAST PATH</text><text x="1084" y="256">CROSS-DOMAIN</text></g>
  <g font-size="9" fill="#f0abfc">
    <text x="1084" y="104">ENOB 21.4 bit</text><text x="1084" y="118">THD -108 dB</text><text x="1084" y="132">drift 3 ppm/K</text><text x="1084" y="146">ch skew 0 sa</text>
    <text x="1084" y="182">BW 200 MHz</text><text x="1084" y="196">t_rise 41 ns</text><text x="1084" y="210">jitter 2.8 ns</text><text x="1084" y="224">overshoot 18 %</text>
    <text x="1084" y="274">shared trigger</text><text x="1084" y="288">FPGA timebase</text><text x="1084" y="302">bus + RF + rails</text><text x="1084" y="316">one timeline</text>
  </g>
  <text x="1084" y="238" font-size="9" fill="#34d399">bench-verified</text>
  <text x="1084" y="340" font-size="9" fill="#f0abfc">sha256 e40b&#8230;</text>
  <text x="1084" y="354" font-size="9" fill="#34d399">re-derivable</text>

  <g font-size="8.5" fill="#5c2f66">
    <text x="34" y="392">24-BIT SIMULTANEOUS ADC</text><text x="260" y="392">HIGH-SPEED CAPTURE</text><text x="470" y="392">FPGA TIMING</text>
    <text x="640" y="392">SIDE-CHANNEL &amp; POWER</text><text x="900" y="392">SAME TIMESTAMP DOMAIN</text>
  </g>
  <rect x="34" y="404" width="1172" height="2" fill="#3d1f45"/>
  <rect x="34" y="404" width="180" height="2" fill="#e879f9"><animate attributeName="x" values="34;1026;34" dur="9s" repeatCount="indefinite"/></rect>
  <text x="34" y="432" fill="#3a2140" font-size="8">an FPGA in a block diagram is not evidence of nanosecond accuracy &#183; latency and jitter are characterised against a disciplined reference first</text>
  <text x="34" y="448" fill="#3a2140" font-size="8">both paths share one trigger and one timebase &#8212; that is what lets a rail transient and a bus error be placed on the same timeline</text>
</svg>
