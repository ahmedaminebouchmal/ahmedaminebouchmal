<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e15"/>
      <stop offset="50%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="aiFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="evGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="aiGlow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1240" height="760" fill="url(#bg)"/>
  <g stroke="#161d29" stroke-width="0.5" opacity="0.6">
    <path d="M0 100h1240M0 200h1240M0 300h1240M0 400h1240M0 500h1240M0 600h1240M0 700h1240"/>
    <path d="M120 0v760M280 0v760M440 0v760M600 0v760M760 0v760M920 0v760M1080 0v760"/>
  </g>

  <!-- ── header ── -->
  <text x="48" y="52" fill="#e6edf3" font-size="27" font-weight="700" letter-spacing="7">BOUCHMAL</text>
  <text x="48" y="78" fill="#7d8590" font-size="12" letter-spacing="2.2">MULTI-DOMAIN INSTRUMENT PLATFORMS &#183; HARDWARE &#183; FIRMWARE &#183; EVIDENCE</text>
  <line x1="48" y1="94" x2="470" y2="94" stroke="#2d5a8e" stroke-width="1.5"/>

  <!-- ── AI EXPERT LAYER ── -->
  <ellipse cx="620" cy="150" rx="300" ry="60" fill="url(#aiGlow)" filter="url(#blur)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.22;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="330" y="118" width="580" height="66" rx="9" fill="url(#aiFill)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="620" y="144" fill="#c4b5fd" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.4">AI / LLM EXPERT LAYER</text>
  <text x="620" y="166" fill="#8b8ba7" font-size="10" text-anchor="middle">diagnose &#183; plan &#183; correlate &#183; request captures &#183; evidence-linked reporting</text>

  <!-- ── CAPABILITY CONTRACT BUS ── -->
  <rect x="150" y="212" width="940" height="3" fill="url(#busGrad)"/>
  <text x="620" y="236" fill="#60a5fa" font-size="10" text-anchor="middle" letter-spacing="2.6">UNIFORM CAPABILITY CONTRACT</text>
  <g font-size="9.5" fill="#79c0ff" text-anchor="middle">
    <text x="392" y="254">/capability</text>
    <text x="506" y="254">/health</text>
    <text x="620" y="254">/mode</text>
    <text x="734" y="254">/capture</text>
    <text x="848" y="254">/evidence</text>
  </g>

  <!-- telemetry rising to the AI -->
  <g fill="none" stroke="none">
    <path id="up1" d="M240 470 L240 300 L470 300 L470 190"/>
    <path id="up2" d="M470 470 L470 190"/>
    <path id="up3" d="M700 470 L700 190"/>
    <path id="up4" d="M930 470 L930 300 L780 300 L780 190"/>
  </g>
  <g>
    <circle r="3" fill="#5eead4" opacity="0.9"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#up1"/></animateMotion></circle>
    <circle r="3" fill="#5eead4" opacity="0.9"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#up2"/></animateMotion></circle>
    <circle r="3" fill="#5eead4" opacity="0.9"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#up3"/></animateMotion></circle>
    <circle r="3" fill="#5eead4" opacity="0.9"><animateMotion dur="3.2s" begin="2.4s" repeatCount="indefinite"><mpath href="#up4"/></animateMotion></circle>
  </g>

  <!-- ── NODE D + SILO ── -->
  <rect x="330" y="286" width="272" height="62" rx="8" fill="#0f1a2a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="352" cy="317" r="4.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
  <text x="370" y="311" fill="#38bdf8" font-size="11.5" font-weight="700">NODE D &#183; CONTROL &amp; EVIDENCE PLANE</text>
  <text x="370" y="328" fill="#8b949e" font-size="9">registry &#183; time authority &#183; authz &#183; segmentation &#183; health</text>
  <text x="466" y="366" fill="#6e7681" font-size="8.5" text-anchor="middle">PLATFORM MODE</text>

  <rect x="638" y="286" width="272" height="62" rx="8" fill="#0f1a2a" stroke="#30363d" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="774" y="311" fill="#8b949e" font-size="11.5" font-weight="700" text-anchor="middle">SILO MODE</text>
  <text x="774" y="328" fill="#6e7681" font-size="9" text-anchor="middle">any node alone &#8594; host &#183; Node D not required</text>
  <text x="774" y="366" fill="#6e7681" font-size="8.5" text-anchor="middle">EVERY NODE IS ITS OWN INSTRUMENT</text>

  <!-- ── NODE ROW ── -->
  <g>
    <!-- A -->
    <rect x="48" y="404" width="150" height="128" rx="8" fill="#111927" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="62" y="428" fill="#f59e0b" font-size="12" font-weight="700">NODE A</text>
    <text x="62" y="444" fill="#c9d1d9" font-size="9.5">RF / WLAN</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="62" y="464">wideband SDR</text><text x="62" y="478">Wi-Fi &#183; BLE</text>
      <text x="62" y="492">802.15.4 &#183; sub-GHz</text><text x="62" y="506">sync RF capture</text>
    </g>
    <rect x="48" y="404" width="150" height="3" fill="#f59e0b"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></rect>

    <!-- B -->
    <rect x="210" y="404" width="150" height="128" rx="8" fill="#111927" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="224" y="428" fill="#a78bfa" font-size="12" font-weight="700">NODE B</text>
    <text x="224" y="444" fill="#c9d1d9" font-size="9.5">NFC / RFID / POS</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="224" y="464">LF/HF RFID</text><text x="224" y="478">ISO-7816 contact</text>
      <text x="224" y="492">POS terminal</text><text x="224" y="506">debug interfaces</text>
    </g>
    <rect x="210" y="404" width="150" height="3" fill="#a78bfa"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>

    <!-- C flagship -->
    <rect x="372" y="392" width="180" height="152" rx="8" fill="#0d1f1c" stroke="#5eead4" stroke-width="2"/>
    <text x="386" y="416" fill="#5eead4" font-size="12.5" font-weight="700">NODE C</text>
    <text x="386" y="432" fill="#c9d1d9" font-size="9.5">AUTOMOTIVE &#183; FLAGSHIP</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="386" y="452">8&#8211;16 isolated CAN-FD</text><text x="386" y="466">LIN &#183; K-Line &#183; FlexRay</text>
      <text x="386" y="480">Automotive Ethernet</text><text x="386" y="494">FPGA/SoC &#183; DDR &#183; NVMe</text>
      <text x="386" y="508">precision analog + HS ADC</text><text x="386" y="522">HW timestamps &#183; PPS/PTP</text>
    </g>
    <rect x="372" y="392" width="180" height="3" fill="#5eead4"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>

    <!-- E -->
    <rect x="564" y="404" width="150" height="128" rx="8" fill="#111927" stroke="#f472b6" stroke-width="1.4"/>
    <text x="578" y="428" fill="#f472b6" font-size="12" font-weight="700">NODE E</text>
    <text x="578" y="444" fill="#c9d1d9" font-size="9.5">CAMERA / PHYSICAL</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="578" y="464">IP &#183; PoE &#183; ONVIF</text><text x="578" y="478">RTSP streams</text>
      <text x="578" y="492">MIPI / GMSL</text><text x="578" y="506">edge vision</text>
    </g>
    <rect x="564" y="404" width="150" height="3" fill="#f472b6"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>

    <!-- F -->
    <rect x="726" y="404" width="150" height="128" rx="8" fill="#111927" stroke="#fb923c" stroke-width="1.4"/>
    <text x="740" y="428" fill="#fb923c" font-size="12" font-weight="700">NODE F</text>
    <text x="740" y="444" fill="#c9d1d9" font-size="9.5">INDUSTRIAL / OT</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="740" y="464">RS-485 &#183; Modbus</text><text x="740" y="478">industrial Ethernet</text>
      <text x="740" y="492">LoRa &#183; 802.15.4</text><text x="740" y="506">sensor / control I/O</text>
    </g>
    <rect x="726" y="404" width="150" height="3" fill="#fb923c"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>

    <!-- G -->
    <rect x="888" y="404" width="150" height="128" rx="8" fill="#111927" stroke="#34d399" stroke-width="1.4"/>
    <text x="902" y="428" fill="#34d399" font-size="12" font-weight="700">NODE G</text>
    <text x="902" y="444" fill="#c9d1d9" font-size="9.5">COHERENT RF / DF</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="902" y="464">multi-channel coherent</text><text x="902" y="478">direction finding</text>
      <text x="902" y="492">array sensing</text><text x="902" y="506">passive sensing</text>
    </g>
    <rect x="888" y="404" width="150" height="3" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></rect>

    <!-- H -->
    <rect x="1050" y="404" width="142" height="128" rx="8" fill="#111927" stroke="#e879f9" stroke-width="1.4"/>
    <text x="1064" y="428" fill="#e879f9" font-size="12" font-weight="700">NODE H</text>
    <text x="1064" y="444" fill="#c9d1d9" font-size="9.5">HW / MIXED-SIGNAL</text>
    <g fill="#8b949e" font-size="8.5">
      <text x="1064" y="464">sync precision acq.</text><text x="1064" y="478">FPGA timing</text>
      <text x="1064" y="492">side-channel research</text><text x="1064" y="506">board characterization</text>
    </g>
    <rect x="1050" y="404" width="142" height="3" fill="#e879f9"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ── EVIDENCE SPINE ── -->
  <rect x="48" y="584" width="1144" height="3" fill="url(#evGrad)"/>
  <text x="620" y="576" fill="#5eead4" font-size="10" text-anchor="middle" letter-spacing="2.6">ONE TIMESTAMP DOMAIN &#183; ONE EVIDENCE MODEL</text>

  <g>
    <rect x="150" y="606" width="180" height="46" rx="6" fill="#0d1f1c" stroke="#2d5a8e" stroke-width="1.2"/>
    <text x="240" y="626" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">CAPTURE</text>
    <text x="240" y="642" fill="#6e7681" font-size="8.5" text-anchor="middle">ts &#183; source &#183; node &#183; hash</text>

    <rect x="404" y="606" width="180" height="46" rx="6" fill="#0d1f1c" stroke="#2d5a8e" stroke-width="1.2"/>
    <text x="494" y="626" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">SOURCE</text>
    <text x="494" y="642" fill="#6e7681" font-size="8.5" text-anchor="middle">provenance &#183; uncertainty</text>

    <rect x="658" y="606" width="180" height="46" rx="6" fill="#0d1f1c" stroke="#2d5a8e" stroke-width="1.2"/>
    <text x="748" y="626" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">EVIDENCE LINK</text>
    <text x="748" y="642" fill="#6e7681" font-size="8.5" text-anchor="middle">SHA-256 chain</text>

    <rect x="912" y="606" width="180" height="46" rx="6" fill="#0d1f1c" stroke="#5eead4" stroke-width="1.6"/>
    <text x="1002" y="626" fill="#5eead4" font-size="10.5" font-weight="700" text-anchor="middle">CORRELATED TIMELINE</text>
    <text x="1002" y="642" fill="#6e7681" font-size="8.5" text-anchor="middle">RF + CAN + camera + analog</text>
  </g>

  <g fill="none" stroke="#2d5a8e" stroke-width="1.4">
    <path id="e1" d="M330 629h74"/><path id="e2" d="M584 629h74"/><path id="e3" d="M838 629h74"/>
  </g>
  <g fill="#5eead4">
    <circle r="3"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
  </g>

  <!-- ── safety footer ── -->
  <text x="48" y="694" fill="#6e7681" font-size="9" letter-spacing="1.8">SAFETY</text>
  <text x="48" y="712" fill="#8b949e" font-size="9.5">fail-silent / receive-only by default &#183; per-channel independent TX chain &#183; service permission AND supervisor AND FPGA AND MCU request</text>
  <text x="48" y="734" fill="#484f58" font-size="8.5">every node advertises the same contract &#183; adding a node never redesigns the platform</text>

  <g stroke="#2d5a8e" stroke-width="1.4" fill="none" opacity="0.75">
    <path d="M22 22h26M22 22v26"/><path d="M1218 738h-26M1218 738v-26"/>
  </g>
</svg>
