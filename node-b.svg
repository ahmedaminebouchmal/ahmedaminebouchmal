<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04120c"/><stop offset="100%" stop-color="#030b07"/>
    </linearGradient>
    <linearGradient id="bscr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05160e"/><stop offset="100%" stop-color="#020a06"/>
    </linearGradient>
    <filter id="bgl"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="bclip"><rect x="176" y="66" width="880" height="300"/></clipPath>
    <clipPath id="blog"><rect x="420" y="76" width="626" height="200"/></clipPath>
  </defs>

  <rect width="1240" height="470" rx="10" fill="url(#bbg)" stroke="#1c2430" stroke-width="1.5"/>

  <text x="34" y="40" fill="#34d399" font-size="12.5" font-weight="700" letter-spacing="2.5">CONTACTLESS &amp; CONTACT INTERFACE</text>
  <text x="34" y="58" fill="#245c43" font-size="8.5" letter-spacing="1.6">NODE B &#183; IDENTITY &amp; SECURE ELEMENT &#183; NO SECRET RECORDED</text>
  <circle cx="1150" cy="34" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
  <text x="1163" y="38" fill="#34d399" font-size="9" letter-spacing="1.2">FIELD</text>

  <!-- left parameters -->
  <rect x="34" y="66" width="128" height="300" rx="5" fill="#061109" stroke="#123a29"/>
  <g font-size="7.5" fill="#245c43">
    <text x="46" y="86">CARRIER</text>
    <text x="46" y="128">BIT RATE</text>
    <text x="46" y="170">STANDARD</text>
    <text x="46" y="212">FIELD STRENGTH</text>
    <text x="46" y="254">CONTACT</text>
    <text x="46" y="296">CAPTURE</text>
    <text x="46" y="338">SECRET FIELDS</text>
  </g>
  <g font-size="10.5" fill="#86efac">
    <text x="46" y="102">13.56 MHz</text>
    <text x="46" y="144">106 kbit/s</text>
    <text x="46" y="186">ISO 14443-A</text>
    <text x="46" y="228">4.2 A/m</text>
    <text x="46" y="270">ISO 7816 T=1</text>
    <text x="46" y="312">timing + APDU</text>
  </g>
  <text x="46" y="354" font-size="10.5" fill="#34d399" font-weight="700">NOT COLLECTED</text>

  <!-- screen -->
  <rect x="176" y="66" width="880" height="300" rx="4" fill="url(#bscr)" stroke="#123a29"/>

  <!-- field rings -->
  <g clip-path="url(#bclip)">
    <g fill="none" stroke="#34d399" stroke-width="1.3">
      <rect x="272" y="150" width="70" height="46" rx="5" opacity="0.85"/>
      <path d="M282 162 h20 M282 172 h34 M282 182 h26" stroke-width="1" opacity="0.5"/>
      <circle cx="307" cy="173" r="30" opacity="0.5">
        <animate attributeName="r" values="30;74" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="307" cy="173" r="30" opacity="0.5">
        <animate attributeName="r" values="30;74" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="248" y="222" fill="#245c43" font-size="7.5">CARD IN FIELD &#183; UID 04:A2:&#8230;:8F</text>

    <!-- modulation envelope -->
    <text x="196" y="262" fill="#245c43" font-size="7.5">LOAD MODULATION</text>
    <g stroke="#34d399" stroke-width="1.2" fill="none" filter="url(#bgl)">
      <path d="M196 320 h14 v-22 h10 v22 h18 v-22 h8 v22 h12 v-22 h16 v22 h10 v-22 h8 v22 h20 v-22 h12 v22 h14 v-22 h10 v22 h16">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="196" y="346" fill="#245c43" font-size="7.5">t_response 4.82 ms &#183; within FWT</text>

    <!-- APDU log -->
    <line x1="410" y1="76" x2="410" y2="356" stroke="#123a29"/>
    <text x="424" y="90" fill="#245c43" font-size="7.5">APDU EXCHANGE &#183; SHAPE ONLY, NEVER CONTENT</text>
    <g clip-path="url(#blog)" font-size="8.5">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 22;0 0" dur="2.4s" repeatCount="indefinite"/>
        <g>
          <text x="424" y="112" fill="#34d399">&#8594;</text><text x="442" y="112" fill="#86efac">SELECT</text><text x="530" y="112" fill="#4b7f66">00 A4 04 00</text><text x="660" y="112" fill="#245c43">AID, 7 bytes</text><text x="860" y="112" fill="#4b7f66">1.94 ms</text>
          <text x="424" y="134" fill="#7dd3fc">&#8592;</text><text x="442" y="134" fill="#86efac">RESPONSE</text><text x="530" y="134" fill="#4b7f66">90 00</text><text x="660" y="134" fill="#245c43">ok</text><text x="860" y="134" fill="#4b7f66">0.42 ms</text>
          <text x="424" y="156" fill="#34d399">&#8594;</text><text x="442" y="156" fill="#86efac">GET DATA</text><text x="530" y="156" fill="#4b7f66">80 CA 9F 7F</text><text x="660" y="156" fill="#245c43">card production data</text><text x="860" y="156" fill="#4b7f66">2.10 ms</text>
          <text x="424" y="178" fill="#7dd3fc">&#8592;</text><text x="442" y="178" fill="#86efac">RESPONSE</text><text x="530" y="178" fill="#4b7f66">61 2A</text><text x="660" y="178" fill="#245c43">42 bytes available</text><text x="860" y="178" fill="#4b7f66">0.38 ms</text>
          <text x="424" y="200" fill="#34d399">&#8594;</text><text x="442" y="200" fill="#86efac">VERIFY</text><text x="530" y="200" fill="#f87171">&#8226;&#8226; REDACTED</text><text x="660" y="200" fill="#f87171">payload never captured</text><text x="860" y="200" fill="#4b7f66">3.61 ms</text>
          <text x="424" y="222" fill="#7dd3fc">&#8592;</text><text x="442" y="222" fill="#86efac">RESPONSE</text><text x="530" y="222" fill="#4b7f66">63 C2</text><text x="660" y="222" fill="#245c43">2 tries remaining</text><text x="860" y="222" fill="#4b7f66">0.44 ms</text>
          <text x="424" y="244" fill="#34d399">&#8594;</text><text x="442" y="244" fill="#86efac">READ REC</text><text x="530" y="244" fill="#4b7f66">00 B2 01 0C</text><text x="660" y="244" fill="#245c43">record 1, SFI 1</text><text x="860" y="244" fill="#4b7f66">1.77 ms</text>
          <text x="424" y="266" fill="#7dd3fc">&#8592;</text><text x="442" y="266" fill="#86efac">RESPONSE</text><text x="530" y="266" fill="#4b7f66">90 00</text><text x="660" y="266" fill="#245c43">ok</text><text x="860" y="266" fill="#4b7f66">0.40 ms</text>
        </g>
      </g>
    </g>
    <rect x="410" y="276" width="646" height="1" fill="#123a29"/>
    <text x="424" y="296" fill="#245c43" font-size="7.5">SESSION</text>
    <text x="424" y="312" fill="#86efac" font-size="9">8 exchanges &#183; 11.3 ms total &#183; 0 timing violations</text>
    <text x="424" y="332" fill="#245c43" font-size="7.5">What is stored: opcode, status word, byte count, timing.</text>
    <text x="424" y="346" fill="#245c43" font-size="7.5">What is not stored: key material, PIN, cardholder data.</text>
  </g>

  <!-- right readouts -->
  <rect x="1072" y="66" width="134" height="300" rx="5" fill="#061109" stroke="#123a29"/>
  <g font-size="7.5" fill="#245c43">
    <text x="1084" y="86">TIMING</text>
    <text x="1084" y="164">CHAIN OF TRUST</text>
    <text x="1084" y="272">EVIDENCE</text>
  </g>
  <g font-size="9" fill="#86efac">
    <text x="1084" y="104">ATR 0.94 ms</text>
    <text x="1084" y="118">FWT margin 61 %</text>
    <text x="1084" y="132">WTX 0 requests</text>
    <text x="1084" y="146">collisions 0</text>
    <text x="1084" y="182">secure boot ok</text>
    <text x="1084" y="196">OTA signed ok</text>
    <text x="1084" y="210">rollback tested</text>
    <text x="1084" y="224">JTAG locked</text>
    <text x="1084" y="238">key in SE</text>
    <text x="1084" y="290">sha256 9b3d&#8230;</text>
    <text x="1084" y="304">APDU shape log</text>
    <text x="1084" y="318">no secret bytes</text>
  </g>
  <text x="1084" y="252" font-size="9" fill="#34d399">provisioned on line</text>
  <text x="1084" y="340" font-size="9" fill="#34d399">redaction enforced</text>
  <text x="1084" y="354" font-size="9" fill="#34d399">at capture layer</text>

  <!-- status -->
  <g font-size="8.5" fill="#245c43">
    <text x="34" y="392">NFC &#183; LF/HF RFID</text>
    <text x="220" y="392">ISO 14443 &#183; ISO 15693</text>
    <text x="450" y="392">ISO 7816 CONTACT</text>
    <text x="660" y="392">POS &amp; DEBUG INTERFACES</text>
    <text x="920" y="392">SAME TIMESTAMP DOMAIN</text>
  </g>
  <rect x="34" y="404" width="1172" height="2" fill="#123a29"/>
  <rect x="34" y="404" width="180" height="2" fill="#34d399">
    <animate attributeName="x" values="34;1026;34" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="432" fill="#1c4433" font-size="8">credential material never enters a repository, a log or a capture &#183; the fields that would carry a secret are not collected at all</text>
  <text x="34" y="448" fill="#1c4433" font-size="8">what is recorded is the shape of the conversation and its timing &#8212; enough to debug an interface, never enough to impersonate one</text>
</svg>
